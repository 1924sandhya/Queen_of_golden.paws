```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Queen of Golden Paws 🐾</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #fff4d6, #ffe1ec);
            color: #5a3d2b;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            padding: 60px 20px;
        }

        .puppy {
            font-size: 90px;
            animation: bounce 2s infinite;
        }

        h1 {
            font-size: 42px;
            margin: 15px 0;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
        }

        button {
            margin-top: 20px;
            padding: 16px 30px;
            border: none;
            border-radius: 30px;
            background: #d99a3d;
            color: white;
            font-size: 19px;
            cursor: pointer;
            box-shadow: 0 5px 15px #c9a66b;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
        }

        #surprise {
            display: none;
            margin-top: 35px;
            animation: appear 1s ease;
        }

        #surprise h2 {
            font-size: 30px;
        }

        /* PUPPY PHOTO */
        .photo-box {
            margin: 25px auto;
            width: 280px;
            height: 280px;
            border-radius: 25px;
            background: white;
            overflow: hidden;
            box-shadow: 0 5px 20px #d8bfa5;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .heart {
            position: fixed;
            font-size: 25px;
            animation: floatUp 3s linear forwards;
            pointer-events: none;
            z-index: 999;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.5);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes floatUp {
            from {
                bottom: 0;
                opacity: 1;
                transform: translateX(0);
            }

            to {
                bottom: 100%;
                opacity: 0;
                transform: translateX(80px);
            }
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 32px;
            }

            .puppy {
                font-size: 70px;
            }

            .photo-box {
                width: 250px;
                height: 250px;
            }

            p {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="puppy">🐶🐾</div>

        <h1>Queen of Golden Paws 👑</h1>

        <p>Welcome to my little world Baby gal! 💕</p>

        <button onclick="showSurprise()">
            Click Me 🐾
        </button>

        <div id="surprise">

            <h2>🎀 Surprise! 🎀</h2>

            <p>
                Hello Luna! 🐶💗<br>
                My Pretty Little Baby! 🥹🐾
            </p>

            <!-- YOUR PUPPY PHOTO -->
            <div class="photo-box">
                <img src="puppy.jpeg" alt="My beautiful puppy">
            </div>

            <p>
                🌸 My little piece of happiness 🌸<br>
                🐾 Lots of love & paw-some memories 🐾
            </p>

        </div>

    </div>

    <script>
        function showSurprise() {

            document.getElementById("surprise").style.display = "block";

            for (let i = 0; i < 20; i++) {

                let heart = document.createElement("div");

                heart.className = "heart";
                heart.innerHTML = "💖";

                heart.style.left = Math.random() * 100 + "vw";

                heart.style.animationDuration =
                    (2 + Math.random() * 2) + "s";

                document.body.appendChild(heart);

                setTimeout(function () {
                    heart.remove();
                }, 4000);
            }
        }
    </script>

</body>

</html>
